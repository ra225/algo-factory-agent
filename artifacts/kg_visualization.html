
    <!DOCTYPE html>
    <html>
    <head>

    <body>
      <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#FF6B6B"></span>业务场景 (Scenario)</div>

        <div class="legend-item"><span class="dot" style="background:#6BCB77"></span>评价指标 (Metric)</div>

      <div id="mynetwork"></div>
      <script type="text/javascript">
        const nodes = new vis.DataSet([{"id": "SC_CHURN", "label": "电信客户流失预测", "group": "Scenario", "color": "#FF6B6B", "title": "[Scenario] SC_CHURN\n{\"label\": \"Scenario\", \"name\": \"电信客户流失预测\", \"task_type\": \"binary_classification\", \"input_schema\": {\"numeric_cols\": \"List[str]\", \"categorical_cols\": \"List[str]\", \"label\": \"int (0/1)\"}, \"output_schema\": {\"predictions\": \"np.ndarray\", \"probabilities\": \"np.ndarray\"}}"}, {"id": "METRIC_AUC", "label": "roc_auc", "group": "Metric", "color": "#6BCB77", "title": "[Metric] METRIC_AUC\n{\"label\": \"Metric\", \"name\": \"roc_auc\", \"threshold\": 0.78, \"direction\": \"maximize\"}"}, {"id": "METRIC_F1", "label": "f1", "group": "Metric", "color": "#6BCB77", "title": "[Metric] METRIC_F1\n{\"label\": \"Metric\", \"name\": \"f1\", \"threshold\": 0.62, \"direction\": \"maximize\"}"}, {"id": "CONST_LEAKAGE", "label": "CONST_LEAKAGE", "group": "Constraint", "color": "#FFD93D", "title": "[Constraint] CONST_LEAKAGE\n{\"label\": \"Constraint\", \"rule\": \"所有缺失值填充与类别编码必须在训练集 fit，在测试集 transform，严禁全量数据提前 fit。\"}"}, {"id": "CONST_UNSEEN", "label": "CONST_UNSEEN", "group": "Constraint", "color": "#FFD93D", "title": "[Constraint] CONST_UNSEEN\n{\"label\": \"Constraint\", \"rule\": \"类别特征编码必须处理测试集中可能出现的未知类别（handle_unknown='ignore'）。\"}"}, {"id": "CAP_PREP_ROBUST", "label": "RobustImputerEncoder (v1.0.2)", "group": "Capability", "color": "#4D96FF", "title": "[Capability] CAP_PREP_ROBUST | 历史分:0.8423\n{\"label\": \"Capability\", \"name\": \"RobustImputerEncoder\", \"category\": \"preprocessing\", \"applicable_conditions\": \"存在缺失值与类别特征的表格数据\", \"implementation_hint\": \"SimpleImputer(strategy='median') + OneHotEncoder(handle_unknown='ignore')\", \"dependencies\": [\"scikit-learn\", \"numpy\", \"pandas\"], \"version\": \"1.0.2\", \"historical_score\": 0.8423}"}, {"id": "CAP_FE_INTERACT", "label": "DomainRatioFeatures (v1.0.0)", "group": "Capability", "color": "#4D96FF", "title": "[Capability] CAP_FE_INTERACT | 历史分:0.83\n{\"label\": \"Capability\", \"name\": \"DomainRatioFeatures\", \"category\": \"feature_engineering\", \"applicable_conditions\": \"包含消费金额、在网时长等连续数值特征\", \"implementation_hint\": \"构造基础消费频次比特征\", \"dependencies\": [\"scikit-learn\", \"numpy\", \"pandas\"], \"version\": \"1.0.0\", \"historical_score\": 0.83}"}, {"id": "CAP_MODEL_RF", "label": "BalancedRandomForest (v1.0.1)", "group": "Capability", "color": "#4D96FF", "title": "[Capability] CAP_MODEL_RF | 历史分:0.8465\n{\"label\": \"Capability\", \"name\": \"BalancedRandomForest\", \"category\": \"model\", \"applicable_conditions\": \"正负样本比例失衡的中小规模表格数据\", \"implementation_hint\": \"RandomForestClassifier(n_estimators=150, class_weight='balanced', max_depth=8, random_state=42)\", \"dependencies\": [\"scikit-learn\", \"numpy\", \"pandas\"], \"version\": \"1.0.1\", \"historical_score\": 0.8465}"}, {"id": "CAP_MODEL_GBDT", "label": "HistGradientBoosting (v1.0.1)", "group": "Capability", "color": "#4D96FF", "title": "[Capability] CAP_MODEL_GBDT | 历史分:0.876\n{\"label\": \"Capability\", \"name\": \"HistGradientBoosting\", \"category\": \"model\", \"applicable_conditions\": \"高维非线性表格特征，需要高AUC表现与快速推理\", \"implementation_hint\": \"HistGradientBoostingClassifier(max_iter=150, learning_rate=0.05, class_weight='balanced', random_state=42)\", \"dependencies\": [\"scikit-learn\", \"numpy\", \"pandas\"], \"version\": \"1.0.1\", \"historical_score\": 0.876}"}, {"id": "CAP_POST_THRESH", "label": "F1OptimalThresholdTuner (v1.0.2)", "group": "Capability", "color": "#4D96FF", "title": "[Capability] CAP_POST_THRESH | 历史分:0.8619\n{\"label\": \"Capability\", \"name\": \"F1OptimalThresholdTuner\", \"category\": \"post_processing\", \"applicable_conditions\": \"类别不平衡场景下默认 0.5 阈值导致 F1 偏低\", \"implementation_hint\": \"基于 PR 曲线搜索最大化 F1-score 的动态分类阈值\", \"dependencies\": [\"scikit-learn\", \"numpy\", \"pandas\"], \"version\": \"1.0.2\", \"historical_score\": 0.8619}"}, {"id": "CAP_FE_CHURN_VELOCITY", "label": "ChurnVelocityAndRiskScore (v1.0.2)", "group": "Capability", "color": "#4D96FF", "title": "[Capability] CAP_FE_CHURN_VELOCITY | 历史分:0.8766\n{\"label\": \"Capability\", \"id\": \"CAP_FE_CHURN_VELOCITY\", \"name\": \"ChurnVelocityAndRiskScore\", \"category\": \"feature_engineering\", \"applicable_conditions\": \"客户流失预测场景，包含月费、总消费、在网时长与投诉次数\", \"implementation_hint\": \"计算月均消费偏差比 (total_charges / (tenure * monthly_charges + 1)) 与单位时长投诉密度\", \"dependencies\": [\"numpy\", \"pandas\"], \"version\": \"1.0.2\", \"historical_score\": 0.8766}"}, {"id": "VER_30140", "label": "VER_30140", "group": "VerificationRecord", "color": "#9B5DE5", "title": "[VerificationRecord] VER_30140\n{\"label\": \"VerificationRecord\", \"timestamp\": \"2026-10-29 04:48:50\", \"plan\": [\"CAP_PREP_ROBUST\", \"CAP_FE_CHURN_VELOCITY\", \"CAP_MODEL_GBDT\", \"CAP_POST_THRESH\"], \"metrics\": {\"roc_auc\": 0.8666, \"f1\": 0.6842, \"precision\": 0.6933, \"recall\": 0.6753, \"runtime_ms\": 854.41, \"peak_memory_mb\": 1.023}, \"passed\": true}"}, {"id": "FAIL_30140", "label": "UnseenCategoryValueError", "group": "FailureCase", "color": "#FF922B", "title": "[FailureCase] FAIL_30140\n{\"label\": \"FailureCase\", \"error_type\": \"UnseenCategoryValueError\", \"root_cause\": \"ValueError: Found unknown categories ['Crypto_New_Unseen'] in column 1 during transform\", \"mitigation_rule\": \"线上/测试集极易出现未见过的类别值，OneHotEncoder 必须显式指定 handle_unknown='ignore'。\"}"}, {"id": "VER_33553", "label": "VER_33553", "group": "VerificationRecord", "color": "#9B5DE5", "title": "[VerificationRecord] VER_33553\n{\"label\": \"VerificationRecord\", \"timestamp\": \"2026-10-29 04:48:53\", \"plan\": [\"CAP_PREP_ROBUST\", \"CAP_FE_CHURN_VELOCITY\", \"CAP_MODEL_RF\", \"CAP_POST_THRESH\"], \"metrics\": {\"roc_auc\": 0.8617, \"f1\": 0.6424, \"precision\": 0.6023, \"recall\": 0.6883, \"runtime_ms\": 1675.67, \"peak_memory_mb\": 0.418}, \"passed\": true}"}, {"id": "FAIL_33553", "label": "UnseenCategoryValueError", "group": "FailureCase", "color": "#FF922B", "title": "[FailureCase] FAIL_33553\n{\"label\": \"FailureCase\", \"error_type\": \"UnseenCategoryValueError\", \"root_cause\": \"ValueError: Found unknown categories ['Crypto_New_Unseen'] in column 1 during transform\", \"mitigation_rule\": \"线上/测试集极易出现未见过的类别值，OneHotEncoder 必须显式指定 handle_unknown='ignore'。\"}"}]);
        const edges = new vis.DataSet([{"from": "SC_CHURN", "to": "METRIC_AUC", "label": "REQUIRES_METRIC"}, {"from": "SC_CHURN", "to": "METRIC_F1", "label": "REQUIRES_METRIC"}, {"from": "SC_CHURN", "to": "CONST_LEAKAGE", "label": "HAS_CONSTRAINT"}, {"from": "SC_CHURN", "to": "CONST_UNSEEN", "label": "HAS_CONSTRAINT"}, {"from": "CAP_PREP_ROBUST", "to": "SC_CHURN", "label": "APPLICABLE_TO"}, {"from": "CAP_PREP_ROBUST", "to": "CAP_FE_INTERACT", "label": "COMPOSED_WITH (0.9)"}, {"from": "CAP_PREP_ROBUST", "to": "CAP_FE_CHURN_VELOCITY", "label": "COMPOSED_WITH (0.94)"}, {"from": "CAP_PREP_ROBUST", "to": "VER_30140", "label": "VERIFIED_BY"}, {"from": "CAP_PREP_ROBUST", "to": "FAIL_30140", "label": "HAS_FAILURE_EXPERIENCE"}, {"from": "CAP_PREP_ROBUST", "to": "VER_33553", "label": "VERIFIED_BY"}, {"from": "CAP_PREP_ROBUST", "to": "FAIL_33553", "label": "HAS_FAILURE_EXPERIENCE"}, {"from": "CAP_FE_INTERACT", "to": "SC_CHURN", "label": "APPLICABLE_TO"}, {"from": "CAP_FE_INTERACT", "to": "CAP_MODEL_GBDT", "label": "COMPOSED_WITH (0.92)"}, {"from": "CAP_FE_INTERACT", "to": "CAP_MODEL_RF", "label": "COMPOSED_WITH (0.85)"}, {"from": "CAP_MODEL_RF", "to": "SC_CHURN", "label": "APPLICABLE_TO"}, {"from": "CAP_MODEL_RF", "to": "CAP_POST_THRESH", "label": "COMPOSED_WITH (0.88)"}, {"from": "CAP_MODEL_RF", "to": "VER_33553", "label": "VERIFIED_BY"}, {"from": "CAP_MODEL_RF", "to": "FAIL_33553", "label": "HAS_FAILURE_EXPERIENCE"}, {"from": "CAP_MODEL_GBDT", "to": "SC_CHURN", "label": "APPLICABLE_TO"}, {"from": "CAP_MODEL_GBDT", "to": "CAP_POST_THRESH", "label": "COMPOSED_WITH (0.95)"}, {"from": "CAP_MODEL_GBDT", "to": "VER_30140", "label": "VERIFIED_BY"}, {"from": "CAP_MODEL_GBDT", "to": "FAIL_30140", "label": "HAS_FAILURE_EXPERIENCE"}, {"from": "CAP_POST_THRESH", "to": "SC_CHURN", "label": "APPLICABLE_TO"}, {"from": "CAP_POST_THRESH", "to": "VER_30140", "label": "VERIFIED_BY"}, {"from": "CAP_POST_THRESH", "to": "FAIL_30140", "label": "HAS_FAILURE_EXPERIENCE"}, {"from": "CAP_POST_THRESH", "to": "VER_33553", "label": "VERIFIED_BY"}, {"from": "CAP_POST_THRESH", "to": "FAIL_33553", "label": "HAS_FAILURE_EXPERIENCE"}, {"from": "CAP_FE_CHURN_VELOCITY", "to": "SC_CHURN", "label": "APPLICABLE_TO"}, {"from": "CAP_FE_CHURN_VELOCITY", "to": "CAP_MODEL_GBDT", "label": "COMPOSED_WITH (0.93)"}, {"from": "CAP_FE_CHURN_VELOCITY", "to": "CAP_MODEL_RF", "label": "COMPOSED_WITH (0.87)"}, {"from": "CAP_FE_CHURN_VELOCITY", "to": "VER_30140", "label": "VERIFIED_BY"}, {"from": "CAP_FE_CHURN_VELOCITY", "to": "FAIL_30140", "label": "HAS_FAILURE_EXPERIENCE"}, {"from": "CAP_FE_CHURN_VELOCITY", "to": "VER_33553", "label": "VERIFIED_BY"}, {"from": "CAP_FE_CHURN_VELOCITY", "to": "FAIL_33553", "label": "HAS_FAILURE_EXPERIENCE"}]);
        const container = document.getElementById('mynetwork');
        const data = { nodes: nodes, edges: edges };
        const options = {
          nodes: {
            shape: 'dot',
            size: 20,
            font: { size: 13, color: '#e2e8f0', strokeWidth: 2, strokeColor: '#0f172a' },
            borderWidth: 2
          },
          edges: {
            width: 1.5,
            color: { color: '#64748b', highlight: '#38bdf8' },
            arrows: { to: { enabled: true, scaleFactor: 0.7 } },
            font: { size: 10, color: '#94a3b8', align: 'middle', strokeWidth: 0 },
            smooth: { type: 'cubicBezier', forceDirection: 'none', roundness: 0.4 }
          },
          physics: {
            barnesHut: { gravitationalConstant: -3800, centralGravity: 0.3, springLength: 130 }
          },
          interaction: { hover: true, tooltipDelay: 100 }
        };
        new vis.Network(container, data, options);
      </script>
